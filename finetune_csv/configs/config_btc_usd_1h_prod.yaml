# Phase 2 production config: Fine-tune Kronos-small on BTC/USD 1h candles from Coinbase
# Improved config with better hyperparameters for production-quality model
#
# Data: python -m data_ingestion.fetch_data --source coinbase --symbol BTC/USD --timeframe 1h --start 2023-01-01 --end 2025-08-01 --out ./data/BTC_USD_1h.csv
#
# Improvements over Phase 1 dev config:
# - kronos-small (24.7M params) instead of mini (4.1M) — 6x more capacity
# - Longer training: 30 tokenizer epochs, 25 basemodel epochs
# - Lower learning rates with more epochs for better convergence
# - Larger batch size (64) for more stable gradients
# - Gradient accumulation for effective batch size of 128
# - Full 512 context window

data:
  data_path: "./data/BTC_USD_1h.csv"
  lookback_window: 512
  predict_window: 48
  max_context: 512
  clip: 5.0
  train_ratio: 0.85
  val_ratio: 0.10
  test_ratio: 0.05

training:
  tokenizer_epochs: 30
  basemodel_epochs: 25
  batch_size: 64
  log_interval: 50
  num_workers: 4
  seed: 42

  tokenizer_learning_rate: 0.0001
  predictor_learning_rate: 0.000002

  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1

  accumulation_steps: 2

model_paths:
  pretrained_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor: "NeoQuasar/Kronos-small"

  exp_name: "btc_usd_1h_prod"
  base_path: "./finetune_csv/finetuned/"

  base_save_path: ""
  finetuned_tokenizer: ""

  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "btc_usd_finetune_prod"
  description: "BTC/USD 1h production fine-tuning — Phase 2 kronos-small"
  use_comet: false

  train_tokenizer: true
  train_basemodel: true
  skip_existing: false

device:
  use_cuda: true
  device_id: 0
