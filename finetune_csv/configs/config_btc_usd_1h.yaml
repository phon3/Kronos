# Phase 1 dev config: Fine-tune Kronos-small on BTC/USD 1h candles from Coinbase
# Data: python -m data_ingestion.fetch_data --source coinbase --symbol BTC/USD --timeframe 1h --start 2024-01-01 --end 2025-08-01 --out ./data/BTC_USD_1h.csv

data:
  data_path: "./data/BTC_USD_1h.csv"
  lookback_window: 512
  predict_window: 48
  max_context: 512
  clip: 5.0
  # Dataset split ratio (chronological split)
  train_ratio: 0.85
  val_ratio: 0.10
  test_ratio: 0.05

training:
  tokenizer_epochs: 20
  basemodel_epochs: 15
  batch_size: 32
  log_interval: 50
  num_workers: 4
  seed: 42

  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.000004

  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1

  accumulation_steps: 1

model_paths:
  # Hugging Face Hub identifiers — will download automatically
  pretrained_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor: "NeoQuasar/Kronos-small"

  exp_name: "btc_usd_1h_dev"
  base_path: "./finetune_csv/finetuned/"

  base_save_path: ""
  finetuned_tokenizer: ""

  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "btc_usd_finetune_dev"
  description: "BTC/USD 1h fine-tuning for family office dev — Phase 1"
  use_comet: false

  train_tokenizer: true
  train_basemodel: true
  skip_existing: false

device:
  use_cuda: true
  device_id: 0
