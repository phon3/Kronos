# Fine-tune Kronos-small on BTC/USD 1d candles from Coinbase
# Daily data has far fewer rows (~2,417) so we use longer lookback and more epochs
#
# Data: python -m data_ingestion.fetch_data --source coinbase --symbol BTC/USD --timeframe 1d --start 2020-01-01 --end 2025-08-01 --out ./data/BTC_USD_1d.csv
#
# Key differences from 1h config:
# - Longer lookback (512 = ~1.5 years of daily bars) to capture macro trends
# - Shorter pred_len (14 = 2 weeks ahead) — appropriate for daily granularity
# - More epochs (40 tokenizer, 35 basemodel) since dataset is small
# - Smaller batch_size (32) due to fewer samples
# - Lower train_ratio (0.80) to keep enough test data for evaluation

data:
  data_path: "./data/BTC_USD_1d.csv"
  lookback_window: 512
  predict_window: 14
  max_context: 512
  clip: 5.0
  train_ratio: 0.80
  val_ratio: 0.12
  test_ratio: 0.08

training:
  tokenizer_epochs: 40
  basemodel_epochs: 35
  batch_size: 32
  log_interval: 20
  num_workers: 4
  seed: 42

  tokenizer_learning_rate: 0.00008
  predictor_learning_rate: 0.0000015

  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1

  accumulation_steps: 4

model_paths:
  pretrained_tokenizer: "NeoQuasar/Kronos-Tokenizer-base"
  pretrained_predictor: "NeoQuasar/Kronos-small"

  exp_name: "btc_usd_1d_prod"
  base_path: "./finetune_csv/finetuned/"

  base_save_path: ""
  finetuned_tokenizer: ""

  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "btc_usd_1d_finetune_prod"
  description: "BTC/USD 1d production fine-tuning — kronos-small"
  use_comet: false

  train_tokenizer: true
  train_basemodel: true
  skip_existing: false

device:
  use_cuda: true
  device_id: 0
